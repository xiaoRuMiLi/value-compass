# 大模型配置。切换供应商只改 [llm] provider 一行（或用环境变量 LLM_PROVIDER）。
# 默认 deepseek：使用 .env 里的 DEEPSEEK_API_KEY；缺 key 或断网时，叙述类功能自动回退模板。
# 想强制离线，改成 provider = "mock" 即可。

[llm]
provider = "deepseek"
temperature = 0.2
max_tokens = 2048
timeout_seconds = 120
# 输入上下文软预算（估算 token）。中文约 1 字 1 token、英文约 4 字符 1 token。
# 超出仅在日志告警，不截断（截断 JSON 会诱发幻觉）；超过 2 倍才做中段截断兜底。
# 质量优先：默认给足，模型上限允许时可继续调大（如 64000 / 128000）。
# 2026-11-24：财报体检新增单季还原与原文事实趋势信号后，五粮液实测约 5.2 万 token，
# 按「质量优先、不一味压缩上下文」上调到 64000，避免日志持续告警也避免压缩证据。
max_input_tokens = 64000

[llm.providers.deepseek]
adapter = "openai_compat"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-chat"

[llm.providers.openai]
adapter = "openai_compat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "gpt-4.1-mini"

[llm.providers.ollama]
adapter = "openai_compat"
base_url = "http://127.0.0.1:11434/v1"
api_key_env = ""
model = "qwen2.5:14b"

[llm.providers.mock]
adapter = "mock"
model = "mock"
