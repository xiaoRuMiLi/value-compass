[web]
host = "127.0.0.1"
port = 8000
# 个股库列表的评分标签缓存秒数；评分来自本地纯计算，数据同步后最多等待一个 TTL 刷新
stock_rating_cache_seconds = 300

[data]
cache_ttl_seconds = 3600

# 港币→人民币汇率：港股 DDM 分红换算用。在线取欧洲央行口径（frankfurter.app），
# 失败时回退到下面的默认值。默认值可按最新汇率手工更新，避免运行时强依赖外部接口。
[fx]
hkd_to_cny_default = 0.85
fx_cache_ttl_seconds = 86400
# 美元口径仅在财报原文以美元披露时使用，当前不做联网核验，来源会随抽取结果一并落库。
usd_to_cny_default = 7.2

[narrative]
cache_ttl_days = 10
# 各叙述模块的输出 token 上限：质量优先，给足论证篇幅；成本/延迟敏感时再调小。
overview_max_tokens = 2000
score_max_tokens = 1200
valuation_max_tokens = 1600
masters_max_tokens = 1800
valuation_params_max_tokens = 2000
forensics_max_tokens = 3000
financial_trend_max_tokens = 1600

# 跨期叙事对照：往年建基线用几份年报（不含最新年报/当期季报）。越多越全但越慢越贵。
drift_history_count = 3

# 财报深度体检的全部窗口参数与触发阈值见 config/forensics.toml（[forensics] / [forensics.thresholds]）

[research]
cache_ttl_days = 7
# 上下文策略：质量优先。研报数量与单篇正文上限给足，避免摘要过短导致解读空泛。
max_reports = 6
chars_per_report = 3000

[intel]
industry_ttl_days = 3
survey_ttl_days = 30
industry_limit = 5
survey_limit = 5
industry_chars = 2000
survey_chars = 2500

[masters]
# 大师叙述注入的情报摘录预算：每类取几篇、每篇截多少字。
intel_limit = 3
report_chars = 1500
industry_chars = 1500
survey_chars = 2000

[valuation]
# 估值参数校准的资料预算：正文越长，g/r 的定参依据越充分。
intel_limit = 3
industry_chars = 1200
survey_chars = 1500
citation_per_kind = 5
citation_total = 20

# FCFF/WACC 无风险利率锚点（A股取中国10Y国债，其它市场取美国10Y国债）。
# 债务成本 Kd = Rf + rf_credit_spread；折现率下限 = Rf + rf_min_risk_premium。
# 两者均为建模假设，仅用于展示与约束 LLM 校准的折现率，不反推 WACC。
rf_credit_spread = 0.015
rf_min_risk_premium = 0.04

# FCFF 的 EV→股权桥接：非经营资产按类别计折价（1.0=全额，0.8=八折）。
# 公允价值类金融资产（交易性/指定公允价值/其他金融资产）与权益类投资（联营/合营/权益工具）
# 流动性或估值确定性较弱，默认八折；存款与长短期理财按面值全额加回，不打折。
# 折价属建模假设，仅影响桥接项、不改变经营现金流折现出的 EV。
# default = 无 LLM / 模板回退时的取值；min/max = LLM 定参边界，代码会钳制到区间内。
[valuation.bridge_discounts]
fair_value = 0.8
equity_invest = 0.8
deposit = 1.0
fair_value_min = 0.6
fair_value_max = 1.0
equity_invest_min = 0.6
equity_invest_max = 1.0

# 超额现金 = 现金类资产 − 营收 × 最低经营现金比例。
# default 同上为回退值；min/max 为 LLM 定参边界。该参数杠杆较小（营收×比例差）。
[valuation.excess_cash_ratio]
default = 0.02
min = 0.01
max = 0.05

# 资产构成摘要：从财报原文抽取投资资产段落供 LLM 判断折价率，控制上下文预算。
[valuation.asset_digest]
max_chars = 2200
max_snippets = 6

# 财报原文非标准口径抽取：字段注册表在 services/financial_extract.py（代码白名单），
# 这里只控制上下文预算。抽取结果按真实报告期落库，标准口径优先、缺项才回退。
[financial_extract]
max_docs = 2
max_chars_per_doc = 12000
max_tokens = 2000
annual_only = false

[logging]
level = "INFO"
