[web]
host = "127.0.0.1"
port = 8000
# 个股库列表的评分标签缓存秒数；评分来自本地纯计算，数据同步后最多等待一个 TTL 刷新
stock_rating_cache_seconds = 300

[data]
cache_ttl_seconds = 3600

# 港币→人民币汇率：港股 DDM 分红换算用。在线取欧洲央行口径（frankfurter.app），
# 失败时回退到下面的默认值。默认值可按最新汇率手工更新，避免运行时强依赖外部接口。
[fx]
hkd_to_cny_default = 0.85
fx_cache_ttl_seconds = 86400

[narrative]
cache_ttl_days = 10
# 各叙述模块的输出 token 上限：质量优先，给足论证篇幅；成本/延迟敏感时再调小。
overview_max_tokens = 2000
score_max_tokens = 1200
valuation_max_tokens = 1600
masters_max_tokens = 1800
valuation_params_max_tokens = 2000
forensics_max_tokens = 3000
financial_trend_max_tokens = 1600

# 跨期叙事对照：往年建基线用几份年报（不含最新年报/当期季报）。越多越全但越慢越贵。
drift_history_count = 3

# 财报深度体检的全部窗口参数与触发阈值见 config/forensics.toml（[forensics] / [forensics.thresholds]）

[research]
cache_ttl_days = 7
# 上下文策略：质量优先。研报数量与单篇正文上限给足，避免摘要过短导致解读空泛。
max_reports = 6
chars_per_report = 3000

[intel]
industry_ttl_days = 3
survey_ttl_days = 30
industry_limit = 5
survey_limit = 5
industry_chars = 2000
survey_chars = 2500

[masters]
# 大师叙述注入的情报摘录预算：每类取几篇、每篇截多少字。
intel_limit = 3
report_chars = 1500
industry_chars = 1500
survey_chars = 2000

[valuation]
# 估值参数校准的资料预算：正文越长，g/r 的定参依据越充分。
intel_limit = 3
industry_chars = 1200
survey_chars = 1500
citation_per_kind = 5
citation_total = 20

[logging]
level = "INFO"
