<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>value-compass</title>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/report.css?v=20261123b">
  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/nav.js" defer></script>
</head>
<body>
  <main>
    <section class="panel">
      <h2>个股概览</h2>
      <div id="tags" class="tags"></div>
      <div id="overviewNarrative" class="narrative">
        <div class="narrative-loading">正在生成概览叙述…</div>
      </div>
      <p id="narrativeSources" class="narrative-sources"></p>
    </section>
    <section class="panel">
      <h2>财务五维评分</h2>
      <div id="dimensions"></div>
      <p id="scoreNarrative" class="score-narrative">正在生成五维解读…</p>
    </section>

    <section class="panel">
      <h2>估值</h2>
      <div id="valuation"></div>
      <div id="valuationParams" class="val-params-panel">
        <p class="val-params-loading">正在校准估值参数（结合财报与研报）…</p>
      </div>
      <p id="valuationLoading" class="valuation-loading">正在生成估值解读…</p>
      <div id="valuationOverall" class="valuation-overall"></div>
    </section>

    <section class="panel">
      <h2>大师观点</h2>
      <div id="masters"></div>
    </section>

    <section class="panel">
      <h2>财报深度体检 <span class="fx-section-extra">法证式风险扫描 · LLM 逐条剖析</span></h2>
      <button id="forensicsRefresh" class="fx-refresh" type="button">重新分析</button>
      <p id="reviewSummary" class="muted"></p>
      <div id="forensics"></div>
      <details class="fx-details">
        <summary>原始量化疑点清单（原体检结果）</summary>
        <ul id="findings"></ul>
      </details>
    </section>

    <section class="panel">
      <h2>日 K 线 <span class="fx-section-extra">财报关键点事件带 · 含原文通读线索 · 点击圆点定位对应卡片</span></h2>
      <div id="kline" class="chart"></div>
      <div id="klineMarkerLegend" class="kline-legend"></div>
    </section>

    <section class="panel">
      <h2>财务摘要</h2>
      <table id="financials">
        <thead>
          <tr><th>报告期</th><th>营收（亿）</th><th>归母净利（亿）</th><th>ROE（%）</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <div id="valuationModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-dialog" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="valuationModalTitle"></h3>
        <button id="valuationModalClose" class="modal-close" type="button" aria-label="关闭">×</button>
      </div>
      <div id="valuationModalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="/static/js/vendor/echarts.min.js"></script>
  <script src="/static/js/valuation-meta.js"></script>
  <script src="/static/js/forensics.js?v=20261123b"></script>
  <script src="/static/js/report.js?v=20261123b"></script>
</body>
</html>
