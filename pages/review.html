<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>value-compass · 财报深度体检</title>
  <link rel="stylesheet" href="/static/css/base.css?v=20261126o">
  <link rel="stylesheet" href="/static/css/report.css?v=20261126o">
  <script src="/static/js/api.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/nav.js?v=20261126o" defer></script>
</head>
<body>
  <main>
    <div class="fx-page-head">
      <h1 id="pageTitle">财报深度体检</h1>
      <div class="fx-page-actions">
        <a id="backReport" class="fx-refresh" href="/report">查看完整报告</a>
        <button id="forensicsRefresh" class="fx-refresh" type="button">重新分析</button>
      </div>
    </div>
    <section class="panel" id="reportFactsPanel">
      <div id="reportFacts"></div>
    </section>

    <section class="panel">
      <p id="summary" class="muted"></p>
      <div id="forensics"></div>
      <details class="fx-details">
        <summary>原始量化疑点清单（原体检结果）</summary>
        <ul id="findings"></ul>
        <p id="integrity" class="muted"></p>
        <ul id="delisting"></ul>
      </details>
    </section>
    <section class="panel" id="sourceDocsPanel">
      <h2>财报原文阅览 <span class="fx-section-extra">当期默认展开 · 往期按年份折叠 · 点击标题阅读全文</span></h2>
      <div id="sourceDocs"></div>
    </section>

    <section class="panel">
      <h2>日 K 线 <span class="fx-section-extra">财报关键点事件带 · 含原文通读线索 · 点击圆点定位对应卡片</span></h2>
      <div id="kline" class="chart"></div>
      <div id="klineMarkerLegend" class="kline-legend"></div>
    </section>
  </main>
  <script src="/static/js/vendor/echarts.min.js"></script>
  <script src="/static/js/document-link.js?v=20261126o"></script>
  <script src="/static/js/forensics.js?v=20261126o"></script>
  <script src="/static/js/report-facts.js?v=20261126o"></script>
  <script src="/static/js/review.js?v=20261126o"></script>
</body>
</html>
